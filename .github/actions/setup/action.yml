# Sets up Node, restores node_modules cache, installs deps on cache miss
# Caller must run actions/checkout before using this action

name: Setup Node and Install
description: Set up Node from .nvmrc, restore the node_modules cache, and install deps on miss

runs:
  using: composite
  steps:
    - name: Set up Node
      id: node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Restore node_modules cache
      id: nm-cache
      uses: actions/cache@v6
      with:
        path: node_modules
        # better-sqlite3 is built for one Node ABI, so the key must track it
        key: >-
          nm-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --legacy-peer-deps
